<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집중 습관 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./index_files/css2" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#1f2a44;--muted:#66708a;--line:#d6dcec;--bar:#9fb2ec;--mine:#e8564f;--btn:#27389b;--btn-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141a2e;--card:#1d2540;--ink:#e8ecf8;--muted:#9aa5c4;--line:#323d63;--bar:#4a62b8;--mine:#ff7a72;--btn:#8aa0ff;--btn-ink:#10163a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;padding:32px 16px 64px}
main{max-width:640px;margin:0 auto}
h1{font-size:28px;line-height:1.3;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 14px}
.opt{display:block;position:relative;margin:0 0 8px}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt input:checked+span{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 12%,transparent);font-weight:500}
.opt input:focus-visible+span{outline:3px solid var(--btn);outline-offset:2px}
button{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar-row{margin:0 0 12px}
.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:4px}
.bar-head b{font-weight:500}
.track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.fill{height:100%;width:0;background:var(--bar);border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fill.mine{background:var(--mine)}
.legend{font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--mine);margin-right:6px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>당신의 집중 습관은?</h1>
  <p class="sub">질문 2개에 답하면 다른 참여자들의 결과가 바로 그래프로 나옵니다.</p>

  <form id="form">
    <div id="questions">
    <div class="card"><h2>하루 중 집중이 가장 잘 되는 시간대는?</h2>
    <label class="opt"><input type="radio" name="time" value="0"><span>이른 아침 (5~8시)</span></label><label class="opt"><input type="radio" name="time" value="1"><span>오전 (8~12시)</span></label><label class="opt"><input type="radio" name="time" value="2"><span>오후 (12~18시)</span></label><label class="opt"><input type="radio" name="time" value="3"><span>저녁 (18~22시)</span></label><label class="opt"><input type="radio" name="time" value="4"><span>밤·새벽 (22시 이후)</span></label>
    </div>
    <div class="card"><h2>집중해야 할 때 가장 먼저 하는 일은?</h2>
    <label class="opt"><input type="radio" name="habit" value="0"><span>커피·차 한 잔</span></label><label class="opt"><input type="radio" name="habit" value="1"><span>음악 틀기</span></label><label class="opt"><input type="radio" name="habit" value="2"><span>책상 정리</span></label><label class="opt"><input type="radio" name="habit" value="3"><span>휴대폰 멀리 두기</span></label><label class="opt"><input type="radio" name="habit" value="4"><span>그냥 바로 시작</span></label>
    </div></div>
    <button type="submit" id="submit" disabled="">제출하고 결과 보기</button>
  </form>

  <section id="results" hidden="">
    <div id="charts"></div>
    <p class="legend"><i></i>내가 고른 답변</p>
    <div class="row" style="margin-top:18px">
      <button type="button" class="ghost" id="again">다시 참여하기</button>
      <button type="button" class="ghost" id="reset">결과 초기화</button>
    </div>
  </section>
</main>

<script>
/* 질문은 여기서 수정하세요 */
const QUESTIONS = [
  { id: "time", title: "하루 중 집중이 가장 잘 되는 시간대는?",
    options: ["이른 아침 (5~8시)", "오전 (8~12시)", "오후 (12~18시)", "저녁 (18~22시)", "밤·새벽 (22시 이후)"] },
  { id: "habit", title: "집중해야 할 때 가장 먼저 하는 일은?",
    options: ["커피·차 한 잔", "음악 틀기", "책상 정리", "휴대폰 멀리 두기", "그냥 바로 시작"] }
];
const KEY = "survey-results-v1";

const $ = s => document.querySelector(s);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };

function renderForm() {
  $("#questions").innerHTML = QUESTIONS.map(q => `
    <div class="card"><h2>${q.title}</h2>
    ${q.options.map((o, i) => `<label class="opt"><input type="radio" name="${q.id}" value="${i}"><span>${o}</span></label>`).join("")}
    </div>`).join("");
}

function renderResults(mine) {
  const data = load();
  $("#charts").innerHTML = QUESTIONS.map(q => {
    const counts = (data[q.id] || q.options.map(() => 0));
    const total = counts.reduce((a, b) => a + b, 0);
    return `<div class="card"><h2>${q.title}</h2>
      ${q.options.map((o, i) => {
        const pct = total ? Math.round(counts[i] / total * 100) : 0;
        return `<div class="bar-row"><div class="bar-head"><b>${o}</b><span>${pct}% (${counts[i]}명)</span></div>
        <div class="track"><div class="fill ${mine && mine[q.id] === i ? "mine" : ""}" data-w="${pct}"></div></div></div>`;
      }).join("")}
      <div class="legend">총 ${total}명 참여</div></div>`;
  }).join("");
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%")));
}

function check() {
  $("#submit").disabled = !QUESTIONS.every(q => document.querySelector(`input[name="${q.id}"]:checked`));
}

$("#form").addEventListener("change", check);
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const data = load(), mine = {};
  QUESTIONS.forEach(q => {
    const v = +document.querySelector(`input[name="${q.id}"]:checked`).value;
    const counts = data[q.id] || q.options.map(() => 0);
    counts[v]++; data[q.id] = counts; mine[q.id] = v;
  });
  save(data);
  $("#form").hidden = true;
  $("#results").hidden = false;
  renderResults(mine);
  window.scrollTo({ top: 0, behavior: "smooth" });
});
$("#again").addEventListener("click", () => {
  renderForm(); check();
  $("#results").hidden = true; $("#form").hidden = false;
});
$("#reset").addEventListener("click", () => {
  if (confirm("모든 설문 결과를 지울까요?")) { save({}); renderResults(null); }
});

renderForm();
</script>


</body></html>
